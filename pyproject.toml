[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "review-sampler"
version = "0.1.0"
description = "Local cross-platform product review sampler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13",
  "fastapi>=0.116",
  "httpx>=0.28",
  "playwright>=1.53",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.4"]
browser = ["playwright>=1.53"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_sampler = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
